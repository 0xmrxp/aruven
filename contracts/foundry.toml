[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26" # Uniswap v4 requires 0.8.26
optimizer = true
optimizer_runs = 400
evm_version = "cancun"

# v4-core uses custom transcript testing; silence warnings from vendored deps
skip = ["lib/v4-core/test"]
fs_permissions = [{ access = "read", path = "./"}]

[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 500 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
